<!-- Only the two faces the first screen actually renders. The rest resolve from the
     inlined @font-face rules when their unicode-range is hit. -->
<link rel="preload" href="/fonts/hind-siliguri-400-bengali.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/hind-siliguri-600-bengali.woff2" as="font" type="font/woff2" crossorigin>

<style>/*__CRITICAL_CSS__*/</style>

<!-- Deferred: the stylesheet for everything below the hero. `media=print` + onload is the
     one-line trick that makes a stylesheet non-render-blocking with no JS dependency. -->
<link rel="stylesheet" href="/styles.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/styles.css"></noscript>

<script>
/* Applied before first paint so the page never flashes the wrong theme. Kept inline and
   tiny on purpose — this is the only blocking script on the page. */
(function(){var r=document.documentElement;
/* Marks that scripting is alive. The scroll-reveal CSS hides blocks until they animate
   in, so it must only apply when something is actually there to reveal them — otherwise
   a failed bundle would leave the whole page blank. */
r.className+=' js';
try{var t=localStorage.getItem('bdec-theme');
if(t!=='night'&&t!=='day')t=matchMedia('(prefers-color-scheme: light)').matches?'day':'night';
r.dataset.theme=t}catch(e){}})();
</script>

<script type="application/ld+json"><!--__JSONLD__--></script>

<body>
<a class="skip" href="#main">Skip to main content</a>

<div id="stars" aria-hidden="true"></div>
<div id="webgl" aria-hidden="true"></div>
<div id="scrim" aria-hidden="true"></div>

<!-- Deliberately NOT a full-screen cover. The headline is the most important thing on the
     page and it is ready the moment the HTML arrives; making it wait behind a 396 KB
     scene download would put LCP entirely at the mercy of the visitor's bandwidth.
     The scene fades in behind the copy when it is ready. -->
<div id="loader" role="status" aria-live="polite">
  <span class="loader__mark" aria-hidden="true" lang="ja">桜</span>
  <span class="loader__track" aria-hidden="true"><i class="loader__bar" id="loader-bar"></i></span>
  <span class="loader__pct" id="loader-pct">Loading scene… 0%</span>
</div>

<!--__BRAND__-->

            aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">☰</button>
    <button class="icon-btn" type="button" data-theme-toggle aria-pressed="false"
            aria-label="Switch to day theme"><span data-theme-icon aria-hidden="true">🌙</span></button>
<!--__CTA__-->
  </div>
</header>

<!--__HERO_PANELS__-->

<!--__FOOTER__-->

</footer>

<!-- The launcher ships in the HTML so it is there from the first paint and never moves;
     the chat panel itself is a separate module fetched only when someone reaches for it.
     It is a LINK to the contact section, not a button: with JavaScript disabled — or if
     the chat module ever fails to load — clicking it still takes the visitor somewhere
     useful instead of doing nothing. app.js intercepts the click once chat is ready. -->
<a class="chat-launcher" id="chat-launcher" href="#contact"
   aria-controls="chat-panel" aria-label="Support centre — ask a question">
  <span class="chat-launcher__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.7 8.7 0 0 1-3.9-.9L3 21l1.9-5.4A8.4 8.4 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5Z"/>
    </svg>
  </span>
  <span class="chat-launcher__label">Ask a question</span>
</a>

<script type="module" src="/app.js"></script>
</body>
